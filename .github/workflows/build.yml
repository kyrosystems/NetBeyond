name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-i686:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: msys2/setup-msys2@v2.27.0
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
      - name: Record toolchain
        run: |
          set -eu
          pacman -Q mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-ninja
          gcc --version
          cmake --version
          ninja --version
      - name: Configure, build and test
        run: |
          set -eu
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: NetBeyond-windows-i686
          path: build/NetBeyond.exe
          if-no-files-found: error
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - run: make test
